{% extends 'base.html' %}

{% block header %}
  <h1 class="h3 text-center">{% block title %}Nova Publicação{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input type="text" class="form-control" name="title" id="title" value="{{ request.form['title'] }}" required>
          </div>
          <div class="mb-3">
            <label for="body" class="form-label">Conteúdo</label>
            <textarea class="form-control" name="body" id="body" rows="5" required>{{ request.form['body'] }}</textarea>
          </div>
          <div class="mb-4">
            <label for="imagem_post" class="form-label">Imagem da Publicação (Opcional)</label>
            <input type="file" class="form-control" name="imagem_post" id="imagem_post" accept="image/*">
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Publicar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
